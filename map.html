<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Map | Student Toolkit</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Runs before first paint so dark mode never flashes white.
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
    </script>
    <!-- The map SVG is 6 MB. Warm the connection while the rest of the page paints. -->
    <link rel="preload" href="campus-map.svg" as="fetch" type="image/svg+xml" crossorigin>
    <style>
        /* Map-specific styles that don't need to be in the global CSS */
        .map-wrapper {
            width: 100%;
            height: 600px;
            background: #ebf0e6;

            border: none;
            border-radius: 10px;

            overflow: hidden;
            position: relative;
            cursor: grab;

            box-shadow: 0 1px 4px rgba(0,0,0,0.08);

            touch-action: none;
            overscroll-behavior: none;
            transition: none;
        }
        .map-wrapper:active {
            cursor: grabbing;
        }

        .search-container {
            margin-bottom: 20px;
        }

        #tarumt-map {
            transition: none !important;
            transform-origin: 0 0;

            image-rendering: optimizeQuality;
            shape-rendering: geometricPrecision;
            text-rendering: geometricPrecision;

            backface-visibility: hidden;
        }

        /* Shown while the SVG downloads, and replaced by it on success. */
        .map-status {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            padding: 20px;
            color: #4b5563;
            font-weight: 600;
        }
        .map-status a { color: #1a73e8; }

        .map-spinner {
            width: 34px;
            height: 34px;
            border: 3px solid rgba(0, 0, 0, 0.12);
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: map-spin 0.8s linear infinite;
        }
        @keyframes map-spin { to { transform: rotate(360deg); } }

        @media (prefers-reduced-motion: reduce) {
            .map-spinner { animation-duration: 3s; }
        }
    </style>
</head>
<body>
    <div class="dashboard">

        <div class="top-nav-bar">
            <a href="index.html" class="btn-back">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
                Back
            </a>
            <button id="theme-toggle" class="btn-dark-mode" onclick="toggleTheme()">🌙 Dark Mode</button>
        </div>

        <header class="page-header" style="margin-bottom: 30px;">
            <h1>Campus Map</h1>
            <span class="subtitle">Pinch to zoom and drag to explore the campus</span>
        </header>

        <main>

            <div class="search-container">
                <label for="map-search" class="visually-hidden">Search the campus map</label>
                <input type="text" id="map-search" class="styled-select" placeholder="🔍 Search for a building, hall, or faculty..."
                       autocomplete="off" role="combobox" aria-expanded="false" aria-controls="map-results"
                       style="padding: 15px; font-size: 1.1rem; border-radius: 30px;">
                <ul id="map-results" class="map-results" hidden></ul>
            </div>

            <div class="map-wrapper" id="map-container">
                <a href="https://maps.google.com/?q=Tunku+Abdul+Rahman+University+of+Management+and+Technology+(TAR+UMT)"
                target="_blank"
                rel="noopener noreferrer"
                class="floating-gmap-btn">

                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>

                Google Maps
                </a>

                <div class="map-controls-right">
                    <button id="toggle-emergency" class="map-control-btn" aria-pressed="false" aria-label="Show emergency assembly points">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                            <line x1="12" y1="9" x2="12" y2="13"></line>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                    </button>

                    <button id="recenter-map" class="map-control-btn" title="Recenter Map" aria-label="Recenter map">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="10"></circle>
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M12 2v2M12 20v2M2 12h2M20 12h2"></path>
                        </svg>
                    </button>

                    <a href="TARUMT_KL_CAMPUS_MAP.pdf" target="_blank" rel="noopener noreferrer" class="map-control-btn" title="Download PDF Map" aria-label="Download PDF map">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                    </a>
                </div>

                <!-- campus-map.svg is injected here by initMap(). -->
                <div class="map-status" id="map-status" role="status" aria-live="polite">
                    <div class="map-spinner" aria-hidden="true"></div>
                    <span>Loading campus map…</span>
                </div>
            </div>
        </main>
    </div>

    <!-- Vendored locally (panzoom 9.4.0) so the map still pans and zooms offline. -->
    <script src="panzoom.min.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
