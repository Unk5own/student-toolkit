<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable | Student Toolkit</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Runs before first paint so dark mode never flashes white.
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
    </script>
</head>
<body>
    <div class="dashboard" style="max-width: 900px;">

        <div class="top-nav-bar">
            <a href="index.html" class="btn-back">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
                Back
            </a>

            <button id="theme-toggle" class="btn-dark-mode" onclick="toggleTheme()">🌙 Dark Mode</button>
        </div>

        <header class="page-header">
            <h1>Class Timetable</h1>
            <span class="subtitle">Your weekly schedule — tap “Missed” to log it against attendance</span>
        </header>

        <main>
            <section class="card-section">
                <h3 id="tt-form-title" style="margin: 0 0 18px 0; color: var(--primary);">Add a class</h3>

                <form id="tt-form" class="tt-form">
                    <div class="input-group-col tt-wide">
                        <label for="tt-subject">Subject</label>
                        <select id="tt-subject" class="styled-select" required></select>
                    </div>

                    <div class="input-group-col">
                        <label for="tt-type">Type</label>
                        <select id="tt-type" class="styled-select">
                            <option>Lecture</option>
                            <option>Tutorial</option>
                            <option>Practical</option>
                        </select>
                    </div>

                    <div class="input-group-col">
                        <label for="tt-day">Day</label>
                        <select id="tt-day" class="styled-select"></select>
                    </div>

                    <div class="input-group-col">
                        <label for="tt-start">Start</label>
                        <input type="time" id="tt-start" class="styled-select" value="09:00" required>
                    </div>

                    <div class="input-group-col">
                        <label for="tt-end">End</label>
                        <input type="time" id="tt-end" class="styled-select" value="11:00" required>
                    </div>

                    <div class="input-group-col tt-wide">
                        <label for="tt-venue">Venue <span style="font-weight: 400; color: var(--text-muted);">(optional)</span></label>
                        <input type="text" id="tt-venue" class="styled-select" placeholder="e.g. DK A, Block M">
                    </div>

                    <div class="tt-submit">
                        <button type="submit" id="tt-submit-btn" class="btn-add">+ Add class</button>
                        <button type="button" id="tt-cancel-btn" class="btn-delete" onclick="cancelTimetableEdit()" hidden>Cancel</button>
                        <p id="tt-status" class="backup-status" role="status" aria-live="polite"></p>
                    </div>
                </form>
            </section>

            <div id="timetable-grid"></div>
        </main>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
