<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker | Student Toolkit</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Runs before first paint so dark mode never flashes white.
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
    </script>
</head>
<body>
    <div class="dashboard" style="max-width: 800px;">
        
        <div class="top-nav-bar">
            <a href="index.html" class="btn-back">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
                Back
            </a>
            
            <button id="theme-toggle" class="btn-dark-mode" onclick="toggleTheme()">🌙 Dark Mode</button>
        </div>

        <header class="page-header">
            <h1>Attendance Tracker</h1>
            <span class="subtitle">Track your safe skips and stay above the 80% limit</span>
        </header>

        <main>

            <div class="tab-bar" role="tablist" aria-label="Attendance categories">
                <button id="tab-y2s3" class="tab-btn is-active" role="tab"
                        aria-selected="true" aria-controls="y2s3-container" tabindex="0">Y2S3 Subjects</button>
                <button id="tab-custom" class="tab-btn" role="tab"
                        aria-selected="false" aria-controls="custom-container" tabindex="-1">Custom Subjects</button>
            </div>

            <div id="y2s3-container" role="tabpanel" aria-labelledby="tab-y2s3" tabindex="0"></div>

            <div id="custom-container" role="tabpanel" aria-labelledby="tab-custom" tabindex="0" hidden></div>

            <div style="text-align: center; margin-top: 40px; padding-bottom: 20px;">
                <button onclick="resetAttendance()" class="btn-delete" style="padding: 10px 20px; font-size: 1rem; border-radius: 8px;">
                    🚨 Reset All Attendance Data
                </button>
            </div>
        </main>
    </div>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
